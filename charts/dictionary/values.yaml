# Values of the go-application chart live under `application:` (alias of the dependency).
# image.tag is written at release time (update-deployment-values); the default only keeps `helm template` working.
#
# One port: 9090 gRPC (cluster internal; gatekeeper is the only caller). The service verifies the JWTs that identity
# issues for the audience `dictionary` (token exchange of gatekeeper), so it needs the issuer and the JWKS URL of
# identity: set them in the Application values of mm-deploy.
application:
  deployment:
    # The image runs as the distroless `nonroot` user (65532).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      # The images volume is a hostpath PVC owned by root: fsGroup makes it writable for uid 65532.
      fsGroup: 65532
    # The Anki library writes the deck through a temporary SQLite file: /tmp must be writable.
    volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      # Card files, images and audio (DICTIONARY_FILES_DIR: <dir>/images and <dir>/audio). The claim is created outside the chart (mm-ansible, tag `pvc`) and
      # must exist before the pod starts, or it stays Pending. ReadWriteOnce hostpath works on a one-node cluster
      # only (also with several replicas); on more nodes use a ReadWriteMany class or object storage.
      - name: files
        persistentVolumeClaim:
          claimName: dictionary-files
    container:
      image:
        repository: huponx/dictionary
        tag: "0.0.0"
      port: 9090
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: files
          mountPath: /data/files
      # config.data below becomes the ConfigMap <name>-env-vars, loaded as environment variables.
      envFrom:
        - configMapRef:
            name: '{{ include "common.name" . }}-env-vars'
      startupProbe:
        tcpSocket:
          port: 9090
        failureThreshold: 30
        periodSeconds: 2
      livenessProbe:
        tcpSocket:
          port: 9090
        periodSeconds: 20
      readinessProbe:
        tcpSocket:
          port: 9090
        periodSeconds: 10
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 96Mi
  service:
    enabled: true
    port: 9090
  config:
    data:
      HOST: "0.0.0.0"
      PORT: "9090"
      LOG_ENCODING: json
      DICTIONARY_AUTH_AUDIENCE: dictionary
      # The preferences of the users are kept by identity: DICTIONARY_IDENTITY_ADDR, DICTIONARY_TOKEN_URL and
      # DICTIONARY_CLIENT_ID (config) and DICTIONARY_CLIENT_SECRET (secret) are set in the Application of mm-deploy.
      DICTIONARY_IDENTITY_AUDIENCE: identity
      # Where the images and the audio of the cards are stored (the PVC mounted above).
      DICTIONARY_FILES_DIR: /data/files
  # Secret values stay out of git: reference existing Secrets (mm-deploy overrides this list).
  secrets: []
  autoscaling:
    enabled: false
  pdb:
    enabled: false
